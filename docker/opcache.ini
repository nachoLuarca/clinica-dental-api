; Opcache para 'php artisan serve' en dev, con codigo bind-mounteado (ver
; comentario en el Dockerfile). Cachea bytecode compilado en memoria para no
; repetir el parseo completo de Laravel + vendor/ en cada request.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.max_accelerated_files=30000
; Sigue reflejando cambios de codigo sin reiniciar: valida por mtime en cada
; request (barato, un stat() por archivo) en vez de re-leer/re-compilar todo.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
